<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile preview</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px 8px;
        background: #18181b;
        font: 13px/1.4 ui-sans-serif, -apple-system, system-ui, sans-serif;
        color: #d4d4d8;
      }
      .bar { display: flex; gap: 8px; align-items: center; }
      select, button {
        font: inherit;
        padding: 4px 8px;
        border: 1px solid #3f3f46;
        border-radius: 6px;
        background: #27272a;
        color: inherit;
      }
      .shell {
        border: 1px solid #3f3f46;
        border-radius: 14px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.4);
        flex: none;
      }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      .size { color: #a1a1aa; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div class="bar">
      <select id="device">
        <option value="390x844">iPhone 14 / 15 — 390x844</option>
        <option value="430x932">iPhone 15 Pro Max — 430x932</option>
        <option value="375x667">iPhone SE — 375x667</option>
        <option value="412x915">Pixel 7 — 412x915</option>
        <option value="768x1024">iPad mini — 768x1024</option>
      </select>
      <button id="reload" type="button">Reload</button>
      <span class="size" id="size"></span>
    </div>
    <div class="shell" id="shell">
      <iframe id="frame" src="/" title="Site preview"></iframe>
    </div>
    <script>
      const shell = document.getElementById("shell");
      const frame = document.getElementById("frame");
      const select = document.getElementById("device");
      const label = document.getElementById("size");

      function apply() {
        const [w, h] = select.value.split("x").map(Number);
        shell.style.width = w + "px";
        shell.style.height = h + "px";
        label.textContent = w + " x " + h;
        try { localStorage.setItem("mobile-preview-device", select.value); } catch {}
      }

      try {
        const saved = localStorage.getItem("mobile-preview-device");
        if (saved) select.value = saved;
      } catch {}

      select.addEventListener("change", apply);
      document.getElementById("reload").addEventListener("click", () => {
        frame.src = frame.src;
      });
      apply();
    </script>
  </body>
</html>
